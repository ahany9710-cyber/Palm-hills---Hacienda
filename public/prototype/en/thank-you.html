<style>
  :root {
    --charcoal: #141414;
    --ink: #1d1b18;
    --bone: #f6f1e8;
    --accent: oklch(0.52 0.20 25);
    --f-serif: "Cormorant Garamond", Georgia, serif;
    --f-sans: "Tajawal", sans-serif;
    --wa: #25D366;
    --wa-deep: #128C7E;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100dvh;
    background: var(--bone);
    color: var(--ink);
    font-family: var(--f-sans);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: clamp(40px, 8vw, 72px) clamp(32px, 6vw, 64px);
    max-width: 560px;
    width: 100%;
    box-shadow: 0 4px 40px rgba(20,20,20,.08);
  }

  .check {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    margin: 0 auto 28px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 32px;
    opacity: .6;
  }

  .logo-row img { width: 28px; height: 28px; }

  .logo-text {
    font-family: var(--f-sans);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink);
  }

  h1 {
    font-family: var(--f-sans);
    font-size: clamp(26px, 5vw, 36px);
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 14px;
    color: var(--ink);
  }

  p {
    font-family: var(--f-serif);
    font-size: clamp(16px, 2.5vw, 19px);
    color: rgba(20,20,20,.65);
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .btn-wa {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--wa);
    color: #fff;
    font-family: var(--f-sans);
    font-size: 16px;
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 12px;
    text-decoration: none;
    width: 100%;
    max-width: 340px;
    margin-bottom: 16px;
    transition: background .2s;
  }
  .btn-wa:hover { background: var(--wa-deep); }
  .btn-wa svg { width: 22px; height: 22px; flex-shrink: 0; }

  .btn-back {
    display: inline-block;
    font-family: var(--f-sans);
    font-size: 14px;
    color: rgba(20,20,20,.5);
    text-decoration: none;
    padding: 8px;
    transition: color .2s;
  }
  .btn-back:hover { color: var(--ink); }
</style>
